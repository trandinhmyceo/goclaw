name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện Actions trên GitHub

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy qua SSH lên VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true # Dừng workflow nếu bất kỳ câu lệnh nào thất bại
          script: |
            echo "=== Bắt đầu quá trình Deploy ==="
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Thư mục deploy hiện tại: $(pwd)"
            
            echo "=== Pull code mới nhất từ nhánh ${{ github.ref_name }} ==="
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            
            echo "=== Khởi động lại dịch vụ và build Docker Image mới ==="
            if command -v make >/dev/null 2>&1; then
              echo "Phát hiện Makefile, chạy 'make up-build'..."
              make up-build
            else
              echo "Không tìm thấy make, chạy bằng docker compose thủ công..."
              # Tạo file VERSION
              git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null > VERSION || echo "dev" > VERSION
              VERSION=$(cat VERSION)
              
              # Định nghĩa COMPOSE lệnh cơ bản
              COMPOSE="docker compose -f docker-compose.yml -f docker-compose.postgres.yml"
              
              # Build
              GOCLAW_VERSION=$VERSION $COMPOSE build --pull
              
              # Up
              GOCLAW_VERSION=$VERSION $COMPOSE up -d
              
              # Upgrade/Migrate
              docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade
            fi
            echo "=== Deploy hoàn tất thành công! ==="
